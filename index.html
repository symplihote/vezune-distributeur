<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Vezune — Distributeur</title>
<link rel="icon" type="image/png" href="./logo.png?v=1">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-0:#f2f2f4;
  --bg-1:#e6e6e9;
  --glass:rgba(255,255,255,.62);
  --glass-soft:rgba(255,255,255,.4);
  --glass-strong:rgba(255,255,255,.8);
  --border:rgba(255,255,255,.65);
  --text-0:#1d1d1f;
  --text-1:#59595d;
  --text-2:#8a8a8e;
  --blue:#0a3d91;
  --blue-2:#1258c9;
  --purple:#3a4152;
  --pink:#556074;
  --green:#22a55e;
  --red:#ff3b30;
  --amber:#ff9f0a;
  --radius:22px;
  --radius-sm:14px;
  --shadow:0 10px 40px -12px rgba(20,20,25,.16);
  --shadow-lg:0 24px 60px -20px rgba(15,15,20,.26);
  --sidebar-bg:rgba(255,255,255,.5);
  color-scheme:light;
}
:root[data-theme="dark"]{
  --bg-0:#0b0c0e;
  --bg-1:#131417;
  --glass:rgba(28,29,33,.66);
  --glass-soft:rgba(28,29,33,.45);
  --glass-strong:rgba(32,33,38,.86);
  --border:rgba(255,255,255,.08);
  --text-0:#f2f2f4;
  --text-1:#b5b6ba;
  --text-2:#7d7e83;
  --blue:#4d8bff;
  --blue-2:#7aa8ff;
  --purple:#8a94aa;
  --pink:#8a94aa;
  --green:#37c26a;
  --red:#ff5449;
  --amber:#ffb340;
  --shadow:0 10px 40px -12px rgba(0,0,0,.55);
  --shadow-lg:0 24px 60px -20px rgba(0,0,0,.7);
  --sidebar-bg:rgba(20,21,24,.6);
  color-scheme:dark;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Display',sans-serif;
  color:var(--text-0);
  background:
    radial-gradient(circle at 12% 8%, rgba(10,61,145,.08) 0%, transparent 45%),
    radial-gradient(circle at 88% 12%, rgba(0,0,0,.04) 0%, transparent 40%),
    radial-gradient(circle at 50% 100%, rgba(10,61,145,.05) 0%, transparent 50%),
    var(--bg-0);
  min-height:100vh;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
  transition:background-color .25s ease,color .25s ease;
}
:root[data-theme="dark"] body{
  background:
    radial-gradient(circle at 12% 8%, rgba(77,139,255,.10) 0%, transparent 45%),
    radial-gradient(circle at 88% 12%, rgba(77,139,255,.05) 0%, transparent 40%),
    var(--bg-0);
}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum";}
::selection{background:rgba(0,113,227,.18);}
::-webkit-scrollbar{width:8px;height:8px;}
::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:10px;}
button{font-family:inherit;cursor:pointer;}
input,select{font-family:inherit;}

/* ---------- blobs ---------- */
.blob{position:fixed;border-radius:50%;filter:blur(70px);opacity:.35;z-index:0;pointer-events:none;}
.blob1{width:520px;height:520px;background:linear-gradient(135deg,#0a3d91,#3a4152);top:-180px;left:-140px;animation:drift1 22s ease-in-out infinite;}
.blob2{width:420px;height:420px;background:linear-gradient(135deg,#556074,#0a3d91);bottom:-160px;right:-120px;animation:drift2 26s ease-in-out infinite;}
.blob3{width:340px;height:340px;background:linear-gradient(135deg,#8a94aa,#1258c9);top:40%;right:10%;animation:drift3 30s ease-in-out infinite;}
:root[data-theme="dark"] .blob{opacity:.22;}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(60px,40px) scale(1.08)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-50px,-30px) scale(1.1)}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-40px,50px) scale(.92)}}
@media (prefers-reduced-motion: reduce){.blob{animation:none!important;}}

/* ---------- glass base ---------- */
.glass{
  background:var(--glass);
  backdrop-filter:blur(24px) saturate(160%);
  -webkit-backdrop-filter:blur(24px) saturate(160%);
  border:1px solid var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
}
.glass-strong{background:var(--glass-strong);}

/* ================= LOGIN ================= */
#login-screen{
  position:relative;z-index:1;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
}
.login-card{
  width:100%;max-width:390px;padding:44px 36px 36px;text-align:center;
  animation:riseIn .7s cubic-bezier(.2,.9,.25,1);
}
@keyframes riseIn{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}
.brand-mark{
  width:64px;height:64px;margin:0 auto 18px;border-radius:18px;
  background:linear-gradient(135deg,var(--blue),var(--purple));
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 10px 26px -8px rgba(0,113,227,.55), inset 0 1px 1px rgba(255,255,255,.5);
  position:relative;overflow:hidden;
}
.brand-mark::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.55),transparent 45%);}
.brand-mark svg{width:30px;height:30px;position:relative;z-index:1;}
.login-card h1{font-size:22px;font-weight:700;margin:0 0 4px;letter-spacing:-.02em;}
.login-card p.sub{color:var(--text-1);font-size:14px;margin:0 0 28px;}
.field{text-align:left;margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--text-1);margin-bottom:6px;letter-spacing:.02em;text-transform:uppercase;}
.field input{
  width:100%;padding:13px 14px;border-radius:13px;border:1px solid rgba(0,0,0,.08);
  background:rgba(255,255,255,.6);font-size:15px;outline:none;transition:.2s;color:var(--text-0);
}
.field input:focus{border-color:var(--blue);box-shadow:0 0 0 4px rgba(0,113,227,.14);background:#fff;}
.btn{
  border:none;border-radius:13px;padding:13px 18px;font-weight:600;font-size:15px;
  transition:.15s transform,.15s box-shadow,.15s opacity;
}
.btn:active{transform:scale(.97);}
.btn-primary{
  background:linear-gradient(135deg,var(--blue),#3d8bff);color:#fff;width:100%;
  box-shadow:0 10px 22px -8px rgba(0,113,227,.55);
}
.btn-primary:hover{box-shadow:0 14px 28px -8px rgba(0,113,227,.6);}
.btn-ghost{background:rgba(0,0,0,.05);color:var(--text-0);}
.btn-ghost:hover{background:rgba(0,0,0,.08);}
.btn-soft-blue{background:rgba(0,113,227,.1);color:var(--blue);}
.btn-soft-blue:hover{background:rgba(0,113,227,.16);}
.btn-danger-soft{background:rgba(255,59,48,.1);color:var(--red);}
.btn-danger-soft:hover{background:rgba(255,59,48,.18);}
.btn-green-soft{background:rgba(34,165,94,.12);color:var(--green);}
.btn-green-soft:hover{background:rgba(34,165,94,.2);}
.err-msg{color:var(--red);font-size:13px;margin-top:10px;min-height:16px;font-weight:500;}

/* ================= APP SHELL ================= */
#app-shell{display:none;position:relative;z-index:1;min-height:100vh;}
.shell-inner{display:flex;min-height:100vh;}
.sidebar{
  display:none;
  width:230px;flex-shrink:0;padding:22px 14px;flex-direction:column;gap:6px;
  position:sticky;top:0;height:100vh;background:var(--sidebar-bg);border-right:1px solid var(--border);
}
.save-indicator{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--text-2);padding:0 4px 8px;font-weight:600;}
.save-indicator .dot{width:6px;height:6px;border-radius:50%;background:var(--green);flex-shrink:0;transition:background .2s;}
.save-indicator.saving .dot{background:var(--amber);animation:pulseDot 1s infinite;}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.35}}
.sidebar-brand{display:flex;align-items:center;gap:10px;padding:8px 10px 22px;}
.sidebar-brand .dot{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--purple));flex-shrink:0;position:relative;box-shadow:inset 0 1px 1px rgba(255,255,255,.5);}
.sidebar-brand span{font-weight:700;font-size:15px;letter-spacing:-.01em;}
.sidebar-brand small{display:block;font-size:11px;color:var(--text-2);font-weight:500;}
.nav-item{
  display:flex;align-items:center;gap:11px;padding:11px 14px;border-radius:13px;
  color:var(--text-1);font-weight:600;font-size:14px;transition:.15s;border:none;background:transparent;text-align:left;width:100%;
}
.nav-item svg{width:18px;height:18px;flex-shrink:0;opacity:.85;}
.nav-item:hover{background:rgba(255,255,255,.5);color:var(--text-0);}
.nav-item.active{background:var(--glass-strong);color:var(--text-0);box-shadow:var(--shadow);}
.nav-item.active svg{opacity:1;color:var(--blue);}
.sidebar-foot{margin-top:auto;padding:10px;}
.sidebar-foot .who{font-size:12px;color:var(--text-2);padding:0 4px 10px;}

.main-area{flex:1;padding:16px 12px 100px;min-width:0;-webkit-tap-highlight-color:transparent;}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:20px;}
.topbar h2{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:0;}
.topbar .sub{color:var(--text-1);font-size:13px;margin-top:3px;}
.topbar > .btn{width:auto;}
@media(min-width:881px){
  .main-area{padding:26px 34px 60px;}
  .topbar{flex-wrap:nowrap;}
  .topbar h2{font-size:26px;}
  .topbar .sub{font-size:13.5px;}
}

.card{background:var(--glass);backdrop-filter:blur(24px) saturate(160%);-webkit-backdrop-filter:blur(24px) saturate(160%);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);padding:16px;}
.card-sm{padding:14px 16px;border-radius:var(--radius-sm);}
.grid{display:grid;gap:12px;}
.g4{grid-template-columns:repeat(2,1fr);}
.g3{grid-template-columns:repeat(2,1fr);}
.g2{grid-template-columns:1fr;}
@media(min-width:881px){
  .grid{gap:16px;}
  .g4{grid-template-columns:repeat(4,1fr);}
  .g3{grid-template-columns:repeat(3,1fr);}
  .g2{grid-template-columns:repeat(2,1fr);}
}

.stat-card{padding:14px 16px;}
.stat-card .label{font-size:11px;font-weight:600;color:var(--text-2);text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px;}
.stat-card .value{font-size:20px;font-weight:800;letter-spacing:-.02em;}
.stat-card .delta{font-size:12px;font-weight:600;margin-top:4px;}
.pill{display:inline-flex;align-items:center;gap:5px;padding:5px 10px;border-radius:99px;font-size:11.5px;font-weight:700;}
.pill-blue{background:rgba(0,113,227,.1);color:var(--blue);}
.pill-green{background:rgba(34,165,94,.12);color:var(--green);}
.pill-red{background:rgba(255,59,48,.1);color:var(--red);}
.pill-amber{background:rgba(255,159,10,.14);color:#a86200;}
.pill-gray{background:rgba(0,0,0,.06);color:var(--text-1);}

table{width:100%;border-collapse:collapse;font-size:12.5px;}
th{text-align:left;color:var(--text-2);font-weight:600;font-size:10.5px;text-transform:uppercase;letter-spacing:.03em;padding:0 8px 8px;white-space:nowrap;}
td{padding:10px 8px;border-top:1px solid rgba(0,0,0,.06);white-space:nowrap;}
tr:hover td{background:rgba(127,127,127,.1);}
.table-wrap{overflow-x:auto;}

.seg{display:inline-flex;background:rgba(0,0,0,.05);border-radius:12px;padding:3px;gap:2px;}
.seg button{border:none;background:transparent;padding:8px 14px;border-radius:9px;font-size:13px;font-weight:600;color:var(--text-1);}
.seg button.active{background:#fff;color:var(--text-0);box-shadow:0 2px 8px rgba(0,0,0,.08);}

.empty-state{text-align:center;padding:50px 20px;color:var(--text-2);}
.empty-state .ico{width:52px;height:52px;margin:0 auto 14px;border-radius:16px;background:rgba(0,113,227,.08);display:flex;align-items:center;justify-content:center;}
.empty-state h3{color:var(--text-0);font-size:16px;margin:0 0 6px;}
.empty-state p{font-size:13.5px;margin:0 0 16px;}

.modal-overlay{position:fixed;inset:0;background:rgba(20,20,30,.4);backdrop-filter:blur(6px);z-index:50;display:flex;align-items:flex-end;justify-content:center;padding:0;animation:fadeIn .18s ease;}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:rgba(255,255,255,.9);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);border:1px solid rgba(255,255,255,.7);border-radius:24px 24px 0 0;box-shadow:var(--shadow-lg);width:100%;max-width:100%;max-height:90vh;overflow:auto;animation:modalIn .22s cubic-bezier(.2,.9,.25,1);padding-bottom:env(safe-area-inset-bottom);}
.modal.wide{max-width:100%;}
@media(min-width:881px){
  .modal-overlay{align-items:center;padding:20px;}
  .modal,.modal.wide{border-radius:26px;}
  .modal{max-width:560px;}
  .modal.wide{max-width:760px;}
}
@keyframes modalIn{from{opacity:0;transform:translateY(14px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:20px 24px;border-bottom:1px solid rgba(0,0,0,.06);position:sticky;top:0;background:rgba(255,255,255,.7);backdrop-filter:blur(20px);z-index:2;}
.modal-head h3{margin:0;font-size:17px;font-weight:700;}
.modal-close{width:30px;height:30px;border-radius:50%;border:none;background:rgba(0,0,0,.06);display:flex;align-items:center;justify-content:center;color:var(--text-1);font-size:15px;}
.modal-close:hover{background:rgba(0,0,0,.1);}
.modal-body{padding:22px 24px 26px;}
.modal-foot{padding:16px 24px 22px;display:flex;gap:10px;justify-content:flex-end;border-top:1px solid rgba(0,0,0,.06);}

.field2{margin-bottom:12px;}
.field2 label{display:block;font-size:12px;font-weight:600;color:var(--text-1);margin-bottom:5px;}
.field2 input,.field2 select{width:100%;padding:12px 12px;border-radius:10px;border:1px solid rgba(0,0,0,.1);background:rgba(255,255,255,.7);font-size:16px;outline:none;min-height:44px;}
.field2 input:focus,.field2 select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,113,227,.12);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:10px;}

/* ================= DISTRIBUTEUR 3D ================= */
.distrib-stage{
  perspective:1600px;padding:30px 10px 10px;display:flex;justify-content:center;
}
.distrib-body{
  width:100%;max-width:460px;transform-style:preserve-3d;transform:rotateX(8deg);
  background:linear-gradient(180deg,#c9ced8,#a9afbd 6%,#9096a6 94%,#7d8494);
  border-radius:26px;padding:16px 14px 20px;box-shadow:var(--shadow-lg), inset 0 2px 3px rgba(255,255,255,.4);
  position:relative;
}
.distrib-body::before{content:"";position:absolute;inset:0;border-radius:26px;background:linear-gradient(115deg,rgba(255,255,255,.35),transparent 40%);pointer-events:none;}
.distrib-header{display:flex;align-items:center;justify-content:space-between;padding:2px 6px 12px;color:#fff;}
.distrib-header .name{font-weight:800;font-size:14px;letter-spacing:-.01em;text-shadow:0 1px 2px rgba(0,0,0,.15);}
.distrib-header .led{width:8px;height:8px;border-radius:50%;background:var(--green);box-shadow:0 0 8px var(--green);}
.floor{
  background:rgba(255,255,255,.5);backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.65);
  border-radius:16px;padding:12px;margin-bottom:10px;cursor:pointer;transition:.2s transform,.2s box-shadow;
  box-shadow:0 8px 20px -10px rgba(20,20,30,.25), inset 0 1px 1px rgba(255,255,255,.6);
  position:relative;
}
.floor:hover{transform:translateZ(6px) translateY(-2px);box-shadow:0 14px 30px -10px rgba(20,20,30,.3), inset 0 1px 1px rgba(255,255,255,.7);}
.floor-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:9px;}
.floor-top .ftitle{font-weight:700;font-size:12.5px;color:var(--text-0);display:flex;align-items:center;gap:7px;}
.floor-top .fnum{width:20px;height:20px;border-radius:6px;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;font-size:10.5px;display:flex;align-items:center;justify-content:center;font-weight:800;}
.floor-rayons{display:grid;grid-template-columns:repeat(auto-fit,minmax(72px,1fr));gap:7px;}
.rayon-chip{
  background:rgba(255,255,255,.65);border:1px solid rgba(255,255,255,.8);border-radius:10px;padding:7px 6px;text-align:center;
  box-shadow:0 3px 8px -4px rgba(0,0,0,.15), inset 0 1px 0 rgba(255,255,255,.8);
}
.rayon-chip .rname{font-size:10.5px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--text-0);}
.rayon-chip .rprice{font-size:11px;font-weight:800;color:var(--blue);margin-top:2px;}
.rayon-chip .rqty{font-size:9.5px;color:var(--text-2);margin-top:3px;font-weight:600;}
.rayon-chip.empty{opacity:.45;}
.rayon-chip.low .rqty{color:var(--red);}
.distrib-slot{margin-top:6px;height:22px;border-radius:0 0 10px 10px;background:linear-gradient(180deg,rgba(0,0,0,.12),rgba(0,0,0,.22));box-shadow:inset 0 3px 6px rgba(0,0,0,.25);}

.rayon-row{display:flex;align-items:center;gap:12px;padding:12px;border-radius:14px;background:rgba(255,255,255,.55);margin-bottom:8px;border:1px solid rgba(0,0,0,.05);}
.rayon-row .rr-num{width:32px;height:32px;border-radius:9px;background:rgba(0,113,227,.1);color:var(--blue);font-weight:800;font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.rayon-row .rr-info{flex:1;min-width:0;}
.rayon-row .rr-name{font-weight:700;font-size:14px;}
.rayon-row .rr-meta{font-size:12px;color:var(--text-2);margin-top:2px;}
.rr-num-input{width:64px;padding:8px 8px;border-radius:9px;border:1px solid rgba(0,0,0,.12);text-align:center;font-weight:700;font-size:14px;background:#fff;}
.rr-num-input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,113,227,.14);}
.stepper{display:flex;flex-direction:column;align-items:center;gap:2px;}
.stepper span{font-size:9.5px;color:var(--text-2);font-weight:700;text-transform:uppercase;}

.mode-banner{display:flex;align-items:center;gap:10px;padding:11px 14px;border-radius:13px;background:linear-gradient(135deg,rgba(0,113,227,.1),rgba(175,82,222,.1));margin-bottom:14px;font-size:13px;font-weight:600;color:var(--blue);}

.hist-item{display:flex;gap:12px;padding:13px 4px;border-bottom:1px solid rgba(0,0,0,.06);}
.hist-item:last-child{border-bottom:none;}
.hist-dot{width:30px;height:30px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;}
.hist-body{flex:1;min-width:0;}
.hist-title{font-weight:700;font-size:13.5px;}
.hist-sub{font-size:12px;color:var(--text-2);margin-top:2px;}
.hist-time{font-size:11.5px;color:var(--text-2);white-space:nowrap;}

.tabbar-mini{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap;}
.chip-btn{border:1px solid rgba(0,0,0,.08);background:rgba(255,255,255,.5);padding:8px 14px;border-radius:11px;font-size:12.5px;font-weight:600;color:var(--text-1);}
.chip-btn.active{background:var(--text-0);color:#fff;border-color:var(--text-0);}

.setup-wrap{max-width:640px;margin:40px auto;}
.floor-editor{border:1px solid rgba(0,0,0,.08);border-radius:16px;padding:16px;margin-bottom:14px;background:rgba(255,255,255,.4);}
.floor-editor-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
.rayon-editor-row{display:grid;grid-template-columns:1.6fr 1fr 1fr auto;gap:8px;margin-bottom:8px;align-items:center;}
.icon-btn{width:38px;height:38px;border-radius:10px;border:none;background:rgba(255,59,48,.1);color:var(--red);display:flex;align-items:center;justify-content:center;flex-shrink:0;}
.icon-btn:hover{background:rgba(255,59,48,.18);}

.progress-bar{height:6px;border-radius:99px;background:rgba(0,0,0,.06);overflow:hidden;}
.progress-fill{height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue),var(--purple));}

.chart-wrap{position:relative;height:220px;}
.chart-wrap.sm{height:190px;}
@media(min-width:881px){
  .chart-wrap{height:280px;}
  .chart-wrap.sm{height:210px;}
}

/* ---- Base layout is phone-first; desktop widens things back above ---- */
.modal-body{padding:16px 16px 22px;}
.modal-head{padding:16px 16px;position:sticky;top:0;background:rgba(255,255,255,.75);backdrop-filter:blur(20px);z-index:2;}
.modal-foot{padding:12px 16px calc(16px + env(safe-area-inset-bottom));display:flex;gap:10px;flex-direction:column-reverse;border-top:1px solid rgba(0,0,0,.06);}
.modal-foot .btn{width:100%;}
.field-row{grid-template-columns:1fr;}
.rayon-editor-row{grid-template-columns:1fr!important;gap:6px;}
.distrib-body{max-width:100%;}
@media(min-width:881px){
  .sidebar{display:flex;}
  .mobile-nav{display:none!important;}
  .modal-body{padding:22px 24px 26px;}
  .modal-head{padding:20px 24px;}
  .modal-foot{padding:16px 24px 22px;flex-direction:row;justify-content:flex-end;}
  .modal-foot .btn{width:auto;}
  .field-row{grid-template-columns:1fr 1fr;}
  .rayon-editor-row{grid-template-columns:1.6fr 1fr 1fr auto;}
  .distrib-body{max-width:460px;}
}
.mobile-nav{display:flex;position:fixed;bottom:0;left:0;right:0;z-index:40;justify-content:space-around;padding:8px 6px calc(8px + env(safe-area-inset-bottom));border-radius:20px 20px 0 0;background:var(--glass-strong);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:var(--shadow-lg);border-top:1px solid var(--border);}
.mobile-nav button{background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--text-2);font-size:9px;font-weight:700;padding:6px 4px;border-radius:12px;flex:1;min-width:0;}
.mobile-nav button svg{width:18px;height:18px;}
.mobile-nav button.active{color:var(--blue);background:rgba(10,61,145,.1);}

/* ================= TOGGLE / SETTINGS ================= */
.toggle-row{display:flex;align-items:center;justify-content:space-between;padding:14px 4px;border-bottom:1px solid rgba(127,127,127,.14);}
.toggle-row:last-child{border-bottom:none;}
.toggle-row .tr-label{font-weight:700;font-size:14px;}
.toggle-row .tr-sub{font-size:12px;color:var(--text-2);margin-top:2px;}
.switch{position:relative;width:46px;height:27px;flex-shrink:0;}
.switch input{opacity:0;width:0;height:0;}
.switch-track{position:absolute;inset:0;background:rgba(127,127,127,.35);border-radius:99px;transition:.2s;cursor:pointer;}
.switch-track::before{content:"";position:absolute;width:23px;height:23px;left:2px;top:2px;background:#fff;border-radius:50%;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:.2s;}
.switch input:checked + .switch-track{background:var(--blue);}
.switch input:checked + .switch-track::before{transform:translateX(19px);}
.admin-gate{max-width:340px;margin:0 auto;text-align:center;padding:10px 0 4px;}
.profile-row{display:flex;align-items:center;gap:12px;padding:12px 4px;border-bottom:1px solid rgba(127,127,127,.14);}
.profile-row:last-child{border-bottom:none;}
.profile-avatar{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;flex-shrink:0;}
.profile-info{flex:1;min-width:0;}
.profile-info .pname{font-weight:700;font-size:13.5px;}
.profile-info .pmeta{font-size:11.5px;color:var(--text-2);margin-top:1px;}
.pw-chip{font-family:'SF Mono',Menlo,monospace;background:rgba(127,127,127,.12);padding:5px 9px;border-radius:8px;font-size:12px;font-weight:700;letter-spacing:.02em;}

/* ================= IMAGE LIBRARY ================= */
.img-thumb{width:38px;height:38px;border-radius:9px;object-fit:cover;background:rgba(127,127,127,.15);flex-shrink:0;border:1px solid rgba(127,127,127,.15);}
.img-thumb.lg{width:64px;height:64px;border-radius:12px;}
.img-pick-row{display:flex;align-items:center;gap:10px;}
.img-pick-row .field2{flex:1;margin-bottom:0;}
.rayon-chip .rimg{width:100%;height:34px;object-fit:cover;border-radius:7px;margin-bottom:4px;background:rgba(127,127,127,.15);}

/* ================= EXPIRATION ================= */
.pill-exp-ok{background:rgba(34,165,94,.12);color:var(--green);}
.pill-exp-soon{background:rgba(255,159,10,.16);color:#a86200;}
:root[data-theme="dark"] .pill-exp-soon{color:var(--amber);}
.pill-exp-over{background:rgba(255,59,48,.14);color:var(--red);}

/* ================= DISTRIBUTEUR 3D REFINEMENT ================= */
.distrib-body{background:linear-gradient(180deg,#e2e4e9,#b9bec9 6%,#9298a8 92%,#787f90);}
:root[data-theme="dark"] .distrib-body{background:linear-gradient(180deg,#3a3c42,#26272c 8%,#1a1b1f 94%,#101113);}
.distrib-glass{position:relative;border-radius:16px;padding:10px 8px 6px;background:linear-gradient(160deg,rgba(255,255,255,.16),rgba(255,255,255,.02));border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 2px 14px rgba(0,0,0,.28), inset 0 0 0 1px rgba(255,255,255,.05);}
.distrib-topstrip{display:flex;align-items:center;justify-content:space-between;padding:0 6px 10px;}
.distrib-display{background:#0d1a2b;color:#5ad1ff;font-family:'SF Mono',Menlo,monospace;font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:6px 10px;border-radius:7px;box-shadow:inset 0 0 6px rgba(0,0,0,.6);}
.distrib-coin{width:26px;height:10px;border-radius:3px;background:linear-gradient(180deg,#3a3f4a,#15171c);box-shadow:inset 0 1px 2px rgba(0,0,0,.6), 0 1px 0 rgba(255,255,255,.08);}
.distrib-tray{margin-top:8px;height:30px;border-radius:0 0 14px 14px;background:linear-gradient(180deg,rgba(0,0,0,.15),rgba(0,0,0,.32));box-shadow:inset 0 4px 8px rgba(0,0,0,.32);position:relative;}
.distrib-tray::before{content:"";position:absolute;left:50%;top:6px;transform:translateX(-50%);width:60%;height:4px;border-radius:3px;background:rgba(0,0,0,.35);}
.rayon-chip{position:relative;}
.rayon-chip .rnum-badge{position:absolute;top:-6px;left:-6px;width:18px;height:18px;border-radius:5px;background:var(--text-0);color:var(--bg-0);font-size:9px;font-weight:800;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 4px rgba(0,0,0,.25);}
</style>
</head>

<script>
(function(){
"use strict";

/* ========================================================================
   CONFIG / CREDENTIALS
======================================================================== */
const CRED_ID = "distrib-vezune-saya";
const CRED_PW = "vN7!qR2#Lx9@Tm4$Kp8&Zs6";
const ADMIN_PW = CRED_PW; // mot de passe admin = mot de passe principal du site

/* ========================================================================
   STORAGE HELPERS (autosave: toute écriture passe par storeSet et met
   immédiatement à jour l'indicateur d'enregistrement)
======================================================================== */
async function storeGet(key, fallback){
  try{
    const r = await window.storage.get(key, false);
    if(!r || r.value===undefined) return fallback;
    return JSON.parse(r.value);
  }catch(e){ return fallback; }
}
let saveIndicatorTimer = null;
function markSaving(){
  const ind = document.getElementById('save-indicator');
  const txt = document.getElementById('save-indicator-text');
  if(!ind) return;
  ind.classList.add('saving');
  if(txt) txt.textContent = 'Enregistrement…';
}
function markSaved(){
  const ind = document.getElementById('save-indicator');
  const txt = document.getElementById('save-indicator-text');
  if(!ind) return;
  ind.classList.remove('saving');
  if(txt) txt.textContent = 'Enregistré · ' + new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}
async function storeSet(key, value){
  markSaving();
  try{
    await window.storage.set(key, JSON.stringify(value), false);
    markSaved();
  }catch(e){
    console.error("storage set failed", key, e);
    const txt = document.getElementById('save-indicator-text');
    if(txt) txt.textContent = 'Échec d\'enregistrement — réessai...';
    // retry once so no change is ever silently lost
    try{ await window.storage.set(key, JSON.stringify(value), false); markSaved(); }catch(e2){ console.error("storage retry failed", key, e2); }
  }
}
/* Sauvegarde complète de tout l'état — utilisée à la déconnexion et à la
   fermeture de l'onglet comme filet de sécurité, en plus des sauvegardes
   déjà déclenchées immédiatement après chaque modification. */
async function saveAllNow(){
  await Promise.all([
    saveProfil(), saveDistrib(), saveStock(), saveRemplissages(),
    saveConnexions(), saveAjustements(), saveSettings(), saveProfiles()
  ]);
}
window.addEventListener('beforeunload', function(){ saveAllNow(); });
document.addEventListener('visibilitychange', function(){ if(document.visibilityState==='hidden') saveAllNow(); });

/* ========================================================================
   STATE
======================================================================== */
const State = {
  profil: null,          // {nom, dateCreation}
  distributeur: null,    // {floors:[{id,nom,rayons:[{id,numero,produit,prixVente,capacity,qty,image,datePeremption}]}]}
  stock: [],              // [{id,nom,prixAchat,prixVente,qty,dateMaj,image,datePeremption}]
  remplissages: [],       // history of fills
  connexions: [],         // login history
  ajustements: [],        // manual cash adjustments
  settings: { darkMode:false },
  profiles: [],           // [{id,nom,identifiant,motDePasse,dateCreation}] comptes additionnels
  currentTab: "distributeur",
  compTaPeriod: "mois"
};

function uid(){ return Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4); }
function fmtMoney(n){
  n = Number(n)||0;
  return n.toLocaleString('fr-FR',{minimumFractionDigits:2,maximumFractionDigits:2}) + " €";
}
function fmtDate(d){
  const dt = new Date(d);
  return dt.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'});
}
function fmtDateTime(d){
  const dt = new Date(d);
  return dt.toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'}) + " · " + dt.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
}

async function loadAll(){
  State.profil = await storeGet('profil', null);
  State.distributeur = await storeGet('distributeur', null);
  State.stock = await storeGet('stock', []);
  State.remplissages = await storeGet('remplissages', []);
  State.connexions = await storeGet('connexions', []);
  State.ajustements = await storeGet('ajustements', []);
  State.settings = await storeGet('settings', { darkMode:false });
  State.profiles = await storeGet('profiles', []);
  applyTheme();
}
async function saveProfil(){ await storeSet('profil', State.profil); }
async function saveDistrib(){ await storeSet('distributeur', State.distributeur); }
async function saveStock(){ await storeSet('stock', State.stock); }
async function saveRemplissages(){ await storeSet('remplissages', State.remplissages); }
async function saveConnexions(){ await storeSet('connexions', State.connexions); }
async function saveAjustements(){ await storeSet('ajustements', State.ajustements); }
async function saveSettings(){ await storeSet('settings', State.settings); }
async function saveProfiles(){ await storeSet('profiles', State.profiles); }

/* ========================================================================
   THEME (mode nuit)
======================================================================== */
function applyTheme(){
  document.documentElement.setAttribute('data-theme', (State.settings && State.settings.darkMode) ? 'dark' : 'light');
}
async function loadThemeEarly(){
  // Permet d'afficher le mode nuit même sur l'écran de connexion,
  // sans attendre la validation des identifiants.
  try{
    const s = await storeGet('settings', { darkMode:false });
    State.settings = s;
    applyTheme();
  }catch(e){}
}

/* ========================================================================
   MOTS DE PASSE ALÉATOIRES (profils additionnels)
======================================================================== */
function generatePassword(len){
  len = len || 14;
  const chars = "ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnopqrstuvwxyz23456789!@#$%&*";
  let out = "";
  const arr = new Uint32Array(len);
  (window.crypto || window.msCrypto).getRandomValues(arr);
  for(let i=0;i<len;i++){ out += chars[arr[i] % chars.length]; }
  return out;
}
function generateIdentifiant(nom){
  const base = String(nom||'user').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'') || 'user';
  return base + '-' + Math.random().toString(36).slice(2,6);
}

/* ========================================================================
   LOGIN
======================================================================== */
const loginForm = document.getElementById('login-form');
const loginErr = document.getElementById('login-err');
let CURRENT_LOGIN_LABEL = CRED_ID;
loginForm.addEventListener('submit', async function(e){
  e.preventDefault();
  const id = document.getElementById('login-id').value.trim();
  const pw = document.getElementById('login-pw').value;
  const existingProfiles = await storeGet('profiles', []);
  const matchProfile = existingProfiles.find(p => p.identifiant === id && p.motDePasse === pw);
  if((id === CRED_ID && pw === CRED_PW) || matchProfile){
    CURRENT_LOGIN_LABEL = matchProfile ? (matchProfile.nom + ' (' + matchProfile.identifiant + ')') : CRED_ID;
    loginErr.textContent = "";
    document.getElementById('login-screen').style.display = 'none';
    document.getElementById('app-shell').style.display = 'block';
    await loadAll();
    State.connexions.unshift({id: uid(), date: new Date().toISOString(), qui: CURRENT_LOGIN_LABEL});
    if(State.connexions.length > 300) State.connexions.length = 300;
    await saveConnexions();
    if(!State.profil){
      renderProfilSetup();
    } else if(!State.distributeur){
      renderDistribSetup();
    } else {
      renderShell();
    }
  } else {
    loginErr.textContent = "Identifiant ou mot de passe incorrect.";
  }
});

async function doLogout(){
  // Filet de sécurité : on force une sauvegarde complète de tout ce qui a
  // été modifié avant de fermer la session, même si chaque changement est
  // déjà enregistré instantanément en temps normal.
  markSaving();
  await saveAllNow();
  markSaved();
  document.getElementById('app-shell').style.display = 'none';
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('login-id').value = '';
  document.getElementById('login-pw').value = '';
  applyTheme();
}
document.getElementById('btn-logout').addEventListener('click', doLogout);

function openConfigModal(){
  setupFloors = JSON.parse(JSON.stringify(State.distributeur.floors));
  const html = '<div class="modal-head"><h3>Configurer le distributeur</h3><button class="modal-close" id="cfg-close">&times;</button></div>'+
    '<div class="modal-body"><div id="setup-floors"></div>'+

    '</div>'+
    '<div class="modal-foot"><button class="btn btn-ghost" id="cfg-cancel">Annuler</button><button class="btn btn-primary" id="cfg-save" style="width:auto;">Enregistrer</button></div>';
  const ov = openModal(html, {wide:true});
  renderSetupFloors();
  ov.querySelector('#setup-add-floor').addEventListener('click', function(){
    setupFloors.push({id:uid(), nom:"Étage "+(setupFloors.length+1), rayons:[]});
    renderSetupFloors();
  });
  ov.querySelector('#cfg-close').addEventListener('click', closeModal);
  ov.querySelector('#cfg-cancel').addEventListener('click', closeModal);
  ov.querySelector('#cfg-save').addEventListener('click', async function(){
    const cleaned = setupFloors.map(f=>({...f, rayons: f.rayons.filter(r=>r.produit)}));
    // preserve qty for rayons that already existed
    cleaned.forEach(function(f){
      const oldFloor = State.distributeur.floors.find(x=>x.id===f.id);
      f.rayons.forEach(function(r){
        if(oldFloor){
          const oldR = oldFloor.rayons.find(x=>x.id===r.id);
          if(oldR) r.qty = oldR.qty;
        }
        if(r.qty===undefined) r.qty = 0;
        if(!r.numero) r.numero = "R";
      });
    });
    State.distributeur = {floors: cleaned};
    await saveDistrib();
    closeModal();
    switchTab('distributeur');
  });
}

/* ---- floor modal with mode remplissage ---- */
function openFloorModal(floorId){
  const floor = State.distributeur.floors.find(f=>f.id===floorId);
  if(!floor) return;
  let fillMode = false;
  const html = renderFloorModalHtml(floor, fillMode);
  const ov = openModal(html, {wide:true});
  bindFloorModal(ov, floor);
}
function renderFloorModalHtml(floor, fillMode){
  return '<div class="modal-head"><h3>'+escapeHtml(floor.nom)+'</h3><button class="modal-close" id="fm-close">&times;</button></div>'+
    '<div class="modal-body">'+
      (fillMode ? '<div class="mode-banner">'+ICONS.refill+' Mode remplissage actif — indiquez ce qu\'il reste, puis ce que vous ajoutez depuis le stock.</div>' : '')+
      '<div id="fm-rayons">'+floor.rayons.map(r=>renderRayonRow(r, fillMode)).join('')+'</div>'+
    '</div>'+
    '<div class="modal-foot">'+
      (fillMode
        ? '<button class="btn btn-ghost" id="fm-cancel-fill">Annuler</button><button class="btn btn-primary" id="fm-validate" style="width:auto;">Valider le remplissage</button>'
        : '<button class="btn btn-ghost" id="fm-close2">Fermer</button><button class="btn btn-soft-blue" id="fm-enter-fill" style="width:auto;">'+ICONS.refill+' Mode remplissage</button>')+
    '</div>';
}
function renderRayonRow(r, fillMode){
  const stock = stockFor(r.produit);
  const stockQty = stock ? stock.qty : 0;
  if(!fillMode){
    const low = (r.qty||0) <= Math.max(1, Math.round((r.capacity||8)*0.15));
    return '<div class="rayon-row">'+
      '<div class="rr-num">'+escapeHtml(r.numero)+'</div>'+
      '<div class="rr-info"><div class="rr-name">'+escapeHtml(r.produit)+'</div>'+

function bindFloorModal(ov, floor){
  ov.querySelector('#fm-close').addEventListener('click', closeModal);
  const closeBtn2 = ov.querySelector('#fm-close2');
  if(closeBtn2) closeBtn2.addEventListener('click', closeModal);
  const enterBtn = ov.querySelector('#fm-enter-fill');
  if(enterBtn) enterBtn.addEventListener('click', function(){
    ov.querySelector('.modal').innerHTML = renderFloorModalHtml(floor, true);
    bindFloorModal(ov, floor);
  });
  const cancelFill = ov.querySelector('#fm-cancel-fill');
  if(cancelFill) cancelFill.addEventListener('click', function(){
    ov.querySelector('.modal').innerHTML = renderFloorModalHtml(floor, false);
    bindFloorModal(ov, floor);
  });
  ov.querySelectorAll('.rayon-row[data-rid]').forEach(function(row){
    const restant = row.querySelector('.fm-restant');
    const ajoute = row.querySelector('.fm-ajoute');
    const venduEl = row.querySelector('.fm-vendu');
    function recalc(){
      const before = parseFloat(restant.dataset.before)||0;
      const restVal = parseFloat(restant.value)||0;
      const vendu = Math.max(0, before - restVal);
      venduEl.textContent = vendu;
    }
    restant.addEventListener('input', recalc);
    ajoute.addEventListener('input', function(){
      const max = parseFloat(ajoute.dataset.maxstock)||0;
      if(parseFloat(ajoute.value) > max){ ajoute.value = max; }
    });
  });
  const validate = ov.querySelector('#fm-validate');
  if(validate) validate.addEventListener('click', async function(){ await validateFloorFill(floor, ov); });
}
async function validateFloorFill(floor, ov){
  const lignes = [];
  let anyChange = false;
  ov.querySelectorAll('.rayon-row[data-rid]').forEach(function(row){
    const rid = row.dataset.rid;
    const r = floor.rayons.find(x=>x.id===rid);
    const restant = parseFloat(row.querySelector('.fm-restant').value)||0;
    const ajoute = parseFloat(row.querySelector('.fm-ajoute').value)||0;
    const before = r.qty||0;
    const vendu = Math.max(0, before - restant);
    const nouveauTotal = Math.min(r.capacity||9999, restant + ajoute);
    if(vendu>0 || ajoute>0){
      anyChange = true;
      const stock = stockFor(r.produit);
      const prixAchat = stock ? stock.prixAchat : 0;
      lignes.push({
        floorId: floor.id, floorNom: floor.nom, rayonId: r.id, rayonNumero: r.numero,
        produitNom: r.produit, qtyRestantAvant: before, qtyVendu: vendu, qtyAjoutee: ajoute,
        prixVenteUnitaire: r.prixVente, prixAchatUnitaire: prixAchat,
        montantVente: +(vendu*r.prixVente).toFixed(2), coutVendu: +(vendu*prixAchat).toFixed(2)
      });
      r.qty = nouveauTotal;
      if(stock && ajoute>0){
        stock.qty = Math.max(0, stock.qty - ajoute);
      }
    }
  });
  if(!anyChange){ closeModal(); return; }
  const totalVendu = lignes.reduce((s,l)=>s+l.qtyVendu,0);
  const totalMontant = +lignes.reduce((s,l)=>s+l.montantVente,0).toFixed(2);
  const totalCout = +lignes.reduce((s,l)=>s+l.coutVendu,0).toFixed(2);
  State.remplissages.unshift({
    id: uid(), date: new Date().toISOString(), floorId: floor.id, floorNom: floor.nom,
    lignes: lignes, totalVendu: totalVendu, totalMontant: totalMontant, totalCout: totalCout,
    totalBenefice: +(totalMontant-totalCout).toFixed(2)
  });
  await saveRemplissages();
  await saveDistrib();
  await saveStock();
  closeModal();
  switchTab('distributeur');
}

function periodStart(period){
  const now = new Date();
  if(period==='semaine'){
    const d = new Date(now); const day = (d.getDay()+6)%7; d.setDate(d.getDate()-day); d.setHours(0,0,0,0); return d;
  }
  if(period==='mois'){ return new Date(now.getFullYear(), now.getMonth(), 1); }
  if(period==='annee'){ return new Date(now.getFullYear(), 0, 1); }
  return new Date(0);
}
function filterByPeriod(arr, period, dateField){
  const start = periodStart(period);
  return arr.filter(x => new Date(x[dateField]) >= start);
}
function renderComptaTab(main){
  const period = State.compTaPeriod;
  const remp = filterByPeriod(State.remplissages, period, 'date');

  const cout = +remp.reduce((s,r)=>s+r.totalCout,0).toFixed(2);

  const totalDepenseCourses = +(State.remplissages.reduce((s,r)=>s+r.totalCout,0) + State.stock.reduce((s,i)=>s+i.qty*i.prixAchat,0)).toFixed(2);
  const totalAdjAll = +State.ajustements.reduce((s,a)=>s+a.montant,0).toFixed(2);

        '<div class="hist-body"><div class="hist-title">Connexion au site</div><div class="hist-sub">Identifiant '+CRED_ID+'</div></div>'+
        '<div class="hist-time">'+fmtDateTime(c.date)+'</div></div>';
    }).join('') : '<p style="color:var(--text-2);font-size:13.5px;">Aucune connexion enregistrée.</p>') + '</div>';
  } else {
    content.innerHTML = '<div class="card">' + (State.remplissages.length ? State.remplissages.map(function(r){
      return '<div class="hist-item"><div class="hist-dot" style="background:rgba(34,165,94,.12);color:var(--green);">'+ICONS.refill+'</div>'+
        '<div class="hist-body"><div class="hist-title">Remplissage — '+escapeHtml(r.floorNom)+'</div>'+
        '<div class="hist-sub">'+r.totalVendu+' unité(s) vendue(s) · '+fmtMoney(r.totalMontant)+' de CA · bénéfice '+fmtMoney(r.totalBenefice)+'</div>'+
        '<div class="hist-sub" style="margin-top:4px;">'+r.lignes.map(l=>escapeHtml(l.rayonNumero)+' '+escapeHtml(l.produitNom)+' ×'+l.qtyVendu).join(', ')+'</div></div>'+
        '<div class="hist-time">'+fmtDateTime(r.date)+'</div></div>';
    }).join('') : '<p style="color:var(--text-2);font-size:13.5px;">Aucun remplissage enregistré. Passez un étage en mode remplissage depuis l\'onglet Distributeur.</p>') + '</div>';
  }
}

/* ========================================================================
   STATISTIQUES TAB
======================================================================== */
let chartInstances = [];
function destroyCharts(){ chartInstances.forEach(c=>c.destroy()); chartInstances=[]; }

function renderStatsTab(main){
  destroyCharts();
  const byRayon = {};
  const byProduct = {};
  const byMonth = {};
  State.remplissages.forEach(function(r){
    r.lignes.forEach(function(l){
      const rkey = l.floorNom + ' · ' + l.rayonNumero;
      byRayon[rkey] = byRayon[rkey] || {qty:0, montant:0};
      byRayon[rkey].qty += l.qtyVendu; byRayon[rkey].montant += l.montantVente;
      byProduct[l.produitNom] = byProduct[l.produitNom] || {qty:0, montant:0};
      byProduct[l.produitNom].qty += l.qtyVendu; byProduct[l.produitNom].montant += l.montantVente;
    });
    const d = new Date(r.date);
    const mkey = d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');
    byMonth[mkey] = (byMonth[mkey]||0) + r.totalMontant;
  });
  const topProducts = Object.entries(byProduct).sort((a,b)=>b[1].qty-a[1].qty).slice(0,8);
  const rayonEntries = Object.entries(byRayon).sort((a,b)=>b[1].montant-a[1].montant);
  const months = Object.keys(byMonth).sort().slice(-12);

  if(!State.remplissages.length){
    main.innerHTML = '<div class="topbar"><div><h2>Statistiques</h2><div class="sub">Ventes par rayon et tendances</div></div></div>'+
      emptyState('box',"Pas encore de données","Les statistiques apparaîtront après votre premier remplissage.", null, null);
    return;
  }

  main.innerHTML =
    '<div class="topbar"><div><h2>Statistiques</h2><div class="sub">Ventes par rayon, produits préférés et tendances</div></div></div>'+
    '<div class="grid g2" style="margin-bottom:18px;">'+
      '<div class="card"><h3 style="margin:0 0 14px;font-size:15px;">Ventes par rayon (quantité)</h3><div class="chart-wrap"><canvas id="chart-rayon-qty"></canvas></div></div>'+
      '<div class="card"><h3 style="margin:0 0 14px;font-size:15px;">Chiffre d\'affaires par rayon</h3><div class="chart-wrap"><canvas id="chart-rayon-ca"></canvas></div></div>'+
    '</div>'+
    '<div class="card" style="margin-bottom:18px;"><h3 style="margin:0 0 14px;font-size:15px;">Chiffre d\'affaires par mois</h3><div class="chart-wrap"><canvas id="chart-month"></canvas></div></div>'+
    '<div class="grid g2">'+
      '<div class="card"><h3 style="margin:0 0 14px;font-size:15px;">Top produits (quantité vendue)</h3><div class="chart-wrap sm"><canvas id="chart-top-products"></canvas></div></div>'+
      '<div class="card"><h3 style="margin:0 0 12px;font-size:15px;">Classement produits</h3>'+
        '<div class="table-wrap"><table><thead><tr><th>Produit</th><th>Qté vendue</th><th>CA généré</th></tr></thead><tbody>'+
        topProducts.map(function(p){ return '<tr><td style="font-weight:600;">'+escapeHtml(p[0])+'</td><td class="num">'+p[1].qty+'</td><td class="num">'+fmtMoney(p[1].montant)+'</td></tr>'; }).join('')+
        '</tbody></table></div></div>'+
    '</div>';

  const palette = ['#0071e3','#af52de','#ff6482','#22a55e','#ff9f0a','#5ac8fa','#ffd60a','#bf5af2'];

  chartInstances.push(new Chart(document.getElementById('chart-rayon-qty'), {
    type:'bar',
    data:{ labels: rayonEntries.map(e=>e[0]), datasets:[{label:'Unités vendues', data: rayonEntries.map(e=>e[1].qty), backgroundColor:'#0071e3', borderRadius:8, maxBarThickness:32}] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{x:{grid:{display:false}},y:{beginAtZero:true, grid:{color:'rgba(0,0,0,.06)'}}} }
  }));
  chartInstances.push(new Chart(document.getElementById('chart-rayon-ca'), {
    type:'doughnut',
    data:{ labels: rayonEntries.map(e=>e[0]), datasets:[{data: rayonEntries.map(e=>e[1].montant), backgroundColor: rayonEntries.map((_,i)=>palette[i%palette.length]) }] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{position:'right', labels:{boxWidth:10,font:{size:11}}}} }
  }));
  chartInstances.push(new Chart(document.getElementById('chart-month'), {
    type:'line',
    data:{ labels: months, datasets:[{label:"CA (€)", data: months.map(m=>+byMonth[m].toFixed(2)), borderColor:'#af52de', backgroundColor:'rgba(175,82,222,.15)', fill:true, tension:.35, pointRadius:3}] },
    options:{ responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{x:{grid:{display:false}},y:{beginAtZero:true, grid:{color:'rgba(0,0,0,.06)'}}} }
  }));
  chartInstances.push(new Chart(document.getElementById('chart-top-products'), {
    type:'bar',
    data:{ labels: topProducts.map(p=>p[0]), datasets:[{label:'Qté', data: topProducts.map(p=>p[1].qty), backgroundColor:'#22a55e', borderRadius:8, maxBarThickness:26}] },
    options:{ indexAxis:'y', responsive:true, maintainAspectRatio:false, plugins:{legend:{display:false}}, scales:{x:{beginAtZero:true, grid:{color:'rgba(0,0,0,.06)'}}, y:{grid:{display:false}}} }
  }));
}

/* ========================================================================
   PARAMETRES TAB (mode nuit + accès admin + gestion des profils)
======================================================================== */
let adminUnlocked = false;
function renderParametresTab(main){
  main.innerHTML =
    '<div class="topbar"><div><h2>Paramètres</h2><div class="sub">Apparence, sécurité et profils</div></div></div>'+
    '<div class="card" style="margin-bottom:18px;">'+
      '<h3 style="margin:0 0 4px;font-size:15px;">Apparence</h3>'+
      '<div class="toggle-row">'+
        '<div><div class="tr-label">Mode nuit</div><div class="tr-sub">Bascule immédiatement l\'interface en thème sombre.</div></div>'+
        '<label class="switch"><input type="checkbox" id="param-dark"'+(State.settings.darkMode?' checked':'')+'><span class="switch-track"></span></label>'+
      '</div>'+
    '</div>'+
    '<div class="card" id="param-security">'+
      '<h3 style="margin:0 0 4px;font-size:15px;">Sécurité &amp; profils</h3>'+
      '<div id="param-security-body"></div>'+
    '</div>';

  main.querySelector('#param-dark').addEventListener('change', async function(e){
    State.settings.darkMode = e.target.checked;
    applyTheme();
    await saveSettings();
  });

  renderSecurityBody(main.querySelector('#param-security-body'));
}

function renderSecurityBody(body){
  if(!adminUnlocked){
    body.innerHTML =
      '<div class="admin-gate">'+
        '<p style="color:var(--text-1);font-size:13.5px;margin:6px 0 16px;">Entrez le mot de passe administrateur pour gérer les profils autorisés à accéder au site.</p>'+
        '<div class="field2" style="text-align:left;"><label>Mot de passe admin</label><input type="password" id="admin-pw-input" placeholder="••••••••••"></div>'+
        '<button class="btn btn-primary" id="admin-unlock-btn" style="width:auto;padding:11px 22px;">Déverrouiller</button>'+
        '<div class="err-msg" id="admin-pw-err"></div>'+
      '</div>';
    body.querySelector('#admin-unlock-btn').addEventListener('click', function(){
      const val = body.querySelector('#admin-pw-input').value;
      if(val === ADMIN_PW){
        adminUnlocked = true;
        renderSecurityBody(body);
      } else {
        body.querySelector('#admin-pw-err').textContent = "Mot de passe incorrect.";
      }
    });
    body.querySelector('#admin-pw-input').addEventListener('keydown', function(e){
      if(e.key==='Enter') body.querySelector('#admin-unlock-btn').click();
    });
    return;
  }

  body.innerHTML =
    '<p style="color:var(--text-1);font-size:13px;margin:2px 0 14px;">Créez des profils supplémentaires avec un identifiant et un mot de passe générés aléatoirement.</p>'+
    '<button class="btn btn-soft-blue" id="add-profile-btn" style="padding:9px 16px;font-size:13px;margin-bottom:14px;">'+ICONS.plus+' Nouveau profil</button>'+
    '<div id="profiles-list">'+
      (State.profiles.length ? State.profiles.map(function(p){
        return '<div class="profile-row"><div class="profile-avatar">'+escapeHtml((p.nom||'?').charAt(0).toUpperCase())+'</div>'+
          '<div class="profile-info"><div class="pname">'+escapeHtml(p.nom)+'</div>'+
          '<div class="pmeta">'+escapeHtml(p.identifiant)+' · créé le '+fmtDate(p.dateCreation)+'</div></div>'+
          '<button class="icon-btn" data-show-pw="'+p.id+'" title="Voir le mot de passe">'+ICONS.login+'</button>'+
          '<button class="icon-btn" data-del-profile="'+p.id+'">'+ICONS.trash+'</button>'+
        '</div>';
      }).join('') : '<p style="color:var(--text-2);font-size:13px;">Aucun profil supplémentaire pour l\'instant.</p>')+
    '</div>';

  body.querySelector('#add-profile-btn').addEventListener('click', async function(){
    const nom = prompt("Nom du profil (ex. prénom de la personne) :");
    if(!nom || !nom.trim()) return;
    const identifiant = generateIdentifiant(nom);
    const motDePasse = generatePassword(14);
    State.profiles.push({id: uid(), nom: nom.trim(), identifiant: identifiant, motDePasse: motDePasse, dateCreation: new Date().toISOString()});
    await saveProfiles();
    renderSecurityBody(body);
    alert("Profil créé.\n\nIdentifiant : "+identifiant+"\nMot de passe : "+motDePasse+"\n\nNotez ces identifiants maintenant.");
  });
  body.querySelectorAll('[data-show-pw]').forEach(function(btn){
    btn.addEventListener('click', function(){
      const p = State.profiles.find(x=>x.id===btn.dataset.showPw);
      if(p) alert("Identifiant : "+p.identifiant+"\nMot de passe : "+p.motDePasse);
    });
  });
  body.querySelectorAll('[data-del-profile]').forEach(function(btn){
    btn.addEventListener('click', async function(){
      if(!confirm('Supprimer ce profil ? La personne ne pourra plus se connecter.')) return;
      State.profiles = State.profiles.filter(p=>p.id!==btn.dataset.delProfile);
      await saveProfiles();
      renderSecurityBody(body);
    });
  });
}

/* ========================================================================
   INIT
======================================================================== */
loadThemeEarly();
document.getElementById('login-id').focus();

})();
</script>
